apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameday-workflow-application-approval
  namespace: gameday-workflow
  labels:
    app: gameday-workflow-application-approval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gameday-workflow-application-approval
  template:
    metadata:
      labels:
        app: gameday-workflow-application-approval
    spec:
      # 出張申請のAIレビューでBedrockを呼ぶため、EKS Pod Identityで権限を渡す。
      # このクラスタの他サービス(nrdojo/dojo-web-pod等)と同じ方式。
      # ServiceAccountとIAMロールの関連付けはk8s/serviceaccount.yamlのコメントを参照。
      serviceAccountName: gameday-workflow-application-approval
      containers:
        - name: gameday-workflow-application-approval
          # CIのdeploy.ymlが `kubectl set image` で実際のECRイメージに差し替える。初回applyのみこのタグが使われる。
          image: gameday-workflow-application-approval:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: DEBUG
              value: "false"
            - name: LOG_LEVEL
              value: "INFO"
            - name: NEW_RELIC_APP_NAME
              value: "gameday-workflow-application-approval"
            - name: NEW_RELIC_CONFIG_FILE
              value: "/app/newrelic.ini"
            # コード側のデフォルト値はdocker-compose用のコンテナ名（workflow-notification-service,
            # gameday_workflow_user_api, gameday-workflow-game-master）を指しており、k8s上の
            # 実際のService名とは異なるためDNS解決に失敗する。明示的に実際のService名を指定する。
            - name: WORKFLOW_SERVICE_BASE_URL
              value: "http://gameday-workflow-workflow-notification:8003"
            - name: USER_SERVICE_BASE_URL
              value: "http://gameday-workflow-user:80"
            - name: GAME_MASTER_SERVICE_BASE_URL
              value: "http://gameday-workflow-game-master:8006"
            # 出張申請の説明文をレビューするAI(Amazon Bedrock)。当日止めたくなったら
            # kubectl set env deployment/... AI_REVIEW_ENABLED=false で無効化できる。
            - name: AI_REVIEW_ENABLED
              value: "true"
            - name: AI_REVIEW_REGION
              value: "ap-northeast-1"
            # 素のモデルIDはオンデマンド非対応のため、推論プロファイル(jp.*)を指定する。
            # Haiku 4.5はこのアカウントでモデルアクセスが無効なのでSonnet 4.5を使う。
            - name: AI_REVIEW_MODEL_ID
              value: "jp.anthropic.claude-sonnet-4-5-20250929-v1:0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-application-approval-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-application-approval-secrets
                  key: secret-key
            - name: USER_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-application-approval-secrets
                  key: user-service-api-key
            - name: GAME_MASTER_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-application-approval-secrets
                  key: user-service-api-key
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-newrelic-secrets
                  key: license-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
