# 出張申請のAIレビュー(Amazon Bedrock)用のServiceAccount。
#
# 権限はEKS Pod Identityで渡す。このクラスタ(Socks)では既に他のnamespaceが同じ方式を
# 使っているため、それに合わせている。ServiceAccount自体に注釈は不要。
#
# 作成済みのAWS側リソース(再作成は不要):
#   ロール : arn:aws:iam::174971999057:role/gameday-workflow-application-approval-bedrock
#   ポリシー: arn:aws:iam::174971999057:policy/gameday-workflow-bedrock-invoke
#            (bedrock:InvokeModel / InvokeModelWithResponseStream を Anthropicモデルと
#             このアカウントの推論プロファイルに限定して許可)
#   関連付け: a-ayjuonqob3gtvgwva (cluster=Socks, namespace=gameday-workflow,
#            serviceAccount=gameday-workflow-application-approval)
#
# 同じものを作り直す場合:
#   aws eks create-pod-identity-association \
#     --cluster-name Socks \
#     --namespace gameday-workflow \
#     --service-account gameday-workflow-application-approval \
#     --role-arn arn:aws:iam::174971999057:role/gameday-workflow-application-approval-bedrock
#
# 関連付けが無い場合、Bedrock呼び出しは権限エラーになるが、AiReviewServiceが
# 「通す」側に倒すため申請自体は成立する(レビューが効かなくなるだけ)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gameday-workflow-application-approval
  namespace: gameday-workflow
  labels:
    app: gameday-workflow-application-approval
