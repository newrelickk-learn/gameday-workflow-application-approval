# 出張申請のAIレビュー(Amazon Bedrock)用のServiceAccount。
#
# 権限はEKS Pod Identityで渡す。このクラスタ(Socks)では既に他のnamespaceが同じ方式を
# 使っているため、それに合わせている。ServiceAccount自体に注釈は不要で、
# クラスタ側で次の関連付けを1度だけ作る:
#
#   aws eks create-pod-identity-association \
#     --cluster-name Socks \
#     --namespace gameday-workflow \
#     --service-account gameday-workflow-application-approval \
#     --role-arn arn:aws:iam::174971999057:role/<BedrockInvoke用のロール>
#
# ロールには bedrock:InvokeModel を、AI_REVIEW_MODEL_IDで指定しているモデル
# (anthropic.claude-haiku-4-5-*)に対して許可する。信頼ポリシーの Principal は
# pods.eks.amazonaws.com、Action は sts:AssumeRole と sts:TagSession。
#
# 関連付けが無い場合、Bedrock呼び出しは権限エラーになるが、AiReviewServiceが
# 「通す」側に倒すため申請自体は成立する(レビューが効かなくなるだけ)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gameday-workflow-application-approval
  namespace: gameday-workflow
  labels:
    app: gameday-workflow-application-approval
