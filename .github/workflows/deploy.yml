name: Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: gameday-workflow-application-approval
  EKS_CLUSTER_NAME: Socks
  K8S_NAMESPACE: gameday-workflow
  K8S_DEPLOYMENT: gameday-workflow-application-approval

jobs:
  build:
    runs-on: ${{ vars.RUNNER_LABELS || 'ubuntu-latest' }}
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes
          driver-opts: |
            namespace=github-new
            replicas=1
            "rootless=true"
          platforms: linux/amd64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag=$(echo "${{ github.ref_name }}" | sed "s/\./-/g")
          else
            tag="latest"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            RELEASE_TAG=${{ github.ref_name }}
          network: host

      - name: Set image output
        id: meta
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ${{ vars.RUNNER_LABELS || 'ubuntu-latest' }}
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Ensure New Relic license key secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret generic gameday-workflow-newrelic-secrets \
            -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=license-key=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          sed -i "s|image: .*|image: ${{ needs.build.outputs.image }}|" k8s/deployment.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}

      - name: Create deployment marker in New Relic
        run: |
          VERSION="${{ github.ref_name }}"
          curl -X POST "https://api.jp.newrelic.com/graphql" \
            -H "Content-Type: application/json" \
            -H "Api-Key: ${{ secrets.NR_USER_KEY }}" \
            --data-binary @- << EOF
          {
            "query": "mutation { changeTrackingCreateEvent( changeTrackingEvent: { categoryAndTypeData: { categoryFields: { deployment: { version: \"${VERSION}\" commit: \"${{ github.sha }}\" changelog: \"Deployed via GitHub Actions\" deepLink: \"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\" } } kind: { category: \"deployment\" type: \"basic\" } } entitySearch: { query: \"accountId=${{ vars.NEW_RELIC_ACCOUNT_ID }} AND name='${{ vars.NEW_RELIC_ENTITY_NAME }}' AND domain='APM'\" } } ) { changeTrackingEvent { entity { name } } } }"
          }
          EOF
